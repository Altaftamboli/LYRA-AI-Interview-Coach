<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Result - LYRA AI Interview Coach</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

</head>


<body class="bg-light">


    <div class="container mt-5 mb-5">


        <div class="card shadow">


            <div class="card-header bg-success text-white text-center">

                <h2 class="mb-0">
                    Interview Result
                </h2>

            </div>


            <div class="card-body">


                <div class="text-center mb-4">

                    <div class="display-3 text-success">
                        0%
                    </div>

                    <h3>
                        Interview Completed!
                    </h3>

                    <p class="text-muted">
                        Your interview has been evaluated by LYRA AI.
                    </p>

                </div>


                <hr>


                <div class="row text-center mb-4">


                    <div class="col-md-4">

                        <h5>
                            Total Questions
                        </h5>

                        <h3 id="totalQuestions">
                            0
                        </h3>

                    </div>


                    <div class="col-md-4">

                        <h5>
                            Correct Answers
                        </h5>

                        <h3 id="correctAnswers">
                            0
                        </h3>

                    </div>


                    <div class="col-md-4">

                        <h5>
                            Overall Score
                        </h5>

                        <h3 class="text-success">
                            <span id="scoreText">
                                0%
                            </span>
                        </h3>

                    </div>


                </div>


                <hr>


                <div class="mb-4">

                    <h3 class="text-success">
                        ✅ Strengths
                    </h3>

                    <ul id="strengths">
                    </ul>

                </div>


                <div class="mb-4">

                    <h3 class="text-danger">
                        ❌ Weaknesses
                    </h3>

                    <ul id="weaknesses">
                    </ul>

                </div>


                <div class="mb-4">

                    <h3 class="text-primary">
                        💡 AI Suggestions
                    </h3>

                    <ul id="suggestions">
                    </ul>

                </div>


                <div class="mb-4">

                    <h3>
                        Question Feedback
                    </h3>

                    <ul id="feedback">
                    </ul>

                </div>


                <div class="text-center mt-4">

                    <button class="btn btn-primary me-2" id="dashboardBtn">
                        Back to Dashboard
                    </button>


                    <button class="btn btn-warning me-2" id="retakeBtn">
                        Retake Interview
                    </button>


                    <button class="btn btn-success" id="downloadBtn">
                        Download Report
                    </button>

                </div>


            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/result.js') }}"></script>

</body>

</html>
