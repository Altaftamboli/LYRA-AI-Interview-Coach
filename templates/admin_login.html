<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LYRA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
        }

        .admin-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1d4ed8;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1d4ed8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="logo">LYRA</div>

        <div class="subtitle">
            Admin Panel Login
        </div>

        <form id="adminLoginForm">

            <label>Email Address</label>

            <input type="email" id="email" placeholder="Admin email" required>

            <label>Password</label>

            <input type="password" id="password" placeholder="Admin password" required>

            <button type="submit">
                Admin Login
            </button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="/">← Back to LYRA</a>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>

</body>

</html>
